name: indexes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  generated-indexes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python3 -m pip install PyYAML==6.0.2
      - name: Check generated indexes
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 spec/scripts/theorem_index.py --check
          python3 spec/scripts/residuals_index.py --check
