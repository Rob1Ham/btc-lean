name: proof scope

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: proof-scope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof-scope:
    name: static proof scope (no Lean build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check proof-scope index
        run: python3 spec/scripts/proof_scope.py --check
