  bip_cve: BIP380
  lean_target: null
  test_vector_ids: []
  status: planned
  difficulty: s
  consensus: false
  notes: Wallet-level descriptor grammar. Does not model typo-correction beyond the checksum's stated error classes.
  source: Bitcoin Core cce32b168 source tree
