# rules-wallet.yaml — second census for wallet construction and signing
#
# This file is separate from spec/db/rules.yaml and is never merged into it.
# It records wallet-level behaviour only: descriptors, miniscript, PSBT,
# spend construction, and wallet signing. Every row is a checkable
# proposition about the pinned Bitcoin Core tree, not a task description.
#
# Ground truth: Bitcoin Core commit
# cce32b16874e85e8a00cfa1a2190f0b6f4dcaf66 (a v21.99 development
# snapshot). Paths in core_ref are relative to the Core source root
# (the directory containing script/, wallet/, psbt.h, pubkey.cpp).
#
# Schema: mirrors a rules.yaml row (id, summary, check, core_ref, bip_cve,
# lean_target, test_vector_ids, status, difficulty, consensus, notes,
# source) with two deliberate differences:
#   * statement  — the checkable proposition required by this census;
#                  summary is only a short label.
#   * difficulty — s | m | l | xl (scope/size estimate, not the 1..5
#                  consensus-census scale).
# `consensus: false` on every row: no wallet row is a consensus rule.
# `status: planned` on every row: none of these is implemented or proven.
#
# Validate with:
#   CORE_SRC=/path/to/bitcoin/src python3 spec/scripts/wallet_census.py
# Rows: 140

rules:
- id: DESC-001
  summary: checksum character set
  statement: DescriptorChecksum returns the empty string if and only if at least one payload character is absent from INPUT_CHARSET.
  check: checksum charset membership
  core_ref: script/descriptor.cpp:169
  bip_cve: BIP380
  lean_target: null
  test_vector_ids: []
  status: planned
  difficulty: s
  consensus: false
  notes: Wallet-level descriptor grammar; not a consensus rule. Does not model private-key descriptors or checksum collision probability.
  source: Bitcoin Core cce32b168 source tree
- id: DESC-002
  summary: checksum symbol grouping
  statement: Every group of three payload characters contributes one extra PolyMod symbol equal to 3*cls + (position >> 5), and a final partial group contributes its accumulated class value.
  check: checksum 3-character grouping
  core_ref: script/descriptor.cpp:171
  bip_cve: BIP380
  lean_target: null
  test_vector_ids: []
  status: planned
  difficulty: m
  consensus: false
  notes: Wallet-level descriptor grammar. Does not model the algebraic proof that single-character edits change at most one checksum symbol.
  source: Bitcoin Core cce32b168 source tree
- id: DESC-003
  summary: checksum finalisation
  statement: After all payload symbols, DescriptorChecksum applies eight zero-valued PolyMod steps and XORs the result with 1 before choosing checksum characters.
  check: checksum final shift and xor
  core_ref: script/descriptor.cpp:180
  bip_cve: BIP380
  lean_target: null
  test_vector_ids: []
  status: planned
  difficulty: s
  consensus: false
  notes: Wallet-level descriptor grammar; the constant is an encoding detail, not a consensus rule.
  source: Bitcoin Core cce32b168 source tree
- id: DESC-004
  summary: checksum alphabet
  statement: The j-th checksum character is CHECKSUM_CHARSET[(c >> (5*(7-j))) & 31] for j from 0 through 7.
