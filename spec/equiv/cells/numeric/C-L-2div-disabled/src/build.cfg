# Source of truth for src/build.sh.  Shell fragment, not executable.
# No op_* handler is used by this cell: its functions are the EvalScript
# disabled-wire gate (twin/runtime.inc disabled_wire, emitted verbatim) and
# Core's OP_SUCCESSx pre-scan excerpt on the C side.  OP_EQUAL is selected
# only because mk_leaf treats an empty set as "all handlers" (and that full
# header does not compile standalone); nothing in the cell calls it.
OPS="OP_EQUAL"
FNS=(cell_gate cell_tap_scan)
# The twin has no tapscript OP_SUCCESSx pre-pass (E4 in twin/generator.md),
# so the L leg only carries the gate.
LFNS=(cell_gate)
